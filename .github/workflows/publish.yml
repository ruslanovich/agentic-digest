name: Publish Agentic Digest

on:
  workflow_dispatch:

  push:
    paths:
      - "queue/ready.jsonl"

  schedule:
    # 11:15, 13:15, 15:15, 17:15, 19:15, 21:15, 23:15 MSK (UTC+3).
    - cron: "15 8 * * *"
    - cron: "15 10 * * *"
    - cron: "15 12 * * *"
    - cron: "15 14 * * *"
    - cron: "15 16 * * *"
    - cron: "15 18 * * *"
    - cron: "15 20 * * *"

permissions:
  contents: write

concurrency:
  group: agentic-digest-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python publisher.py

      - name: Commit publication state
        run: |
          git config user.name "agentic-digest-bot"
          git config user.email "agentic-digest-bot@users.noreply.github.com"

          git add state/published.jsonl
          git commit -m "Update publication state" || exit 0
          git push
