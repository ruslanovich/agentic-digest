name: Publish Agentic Digest

on:
  workflow_dispatch:

  schedule:
    # 11:25, 13:25, 15:25, 17:25, 19:25, 21:25, 23:25 MSK (UTC+3).
    - cron: "25 8 * * *"
    - cron: "25 10 * * *"
    - cron: "25 12 * * *"
    - cron: "25 14 * * *"
    - cron: "25 16 * * *"
    - cron: "25 18 * * *"
    - cron: "25 20 * * *"

permissions:
  contents: write

concurrency:
  group: agentic-digest-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python publisher.py

      - name: Commit publication state
        run: |
          git config user.name "agentic-digest-bot"
          git config user.email "agentic-digest-bot@users.noreply.github.com"

          git add state/published.jsonl
          git commit -m "Update publication state" || exit 0
          git push
