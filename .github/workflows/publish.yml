name: Publish Agentic Digest

on:
  workflow_dispatch:

  push:
    paths:
      - "queue/ready.jsonl"

  schedule:
    # 11:07, 13:07, 15:07, 17:07, 19:07, 21:07, 23:07 MSK (UTC+3).
    # Explicit entries avoid ambiguity and keep runs away from the top of the hour.
    - cron: "7 8 * * *"
    - cron: "7 10 * * *"
    - cron: "7 12 * * *"
    - cron: "7 14 * * *"
    - cron: "7 16 * * *"
    - cron: "7 18 * * *"
    - cron: "7 20 * * *"

permissions:
  contents: write

concurrency:
  group: agentic-digest-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python publisher.py

      - name: Commit publication state
        run: |
          git config user.name "agentic-digest-bot"
          git config user.email "agentic-digest-bot@users.noreply.github.com"

          git add state/published.jsonl
          git commit -m "Update publication state" || exit 0
          git push
