name: Publish Agentic Digest

on:
  workflow_dispatch:

  push:
    paths:
      - "queue/ready.jsonl"

  schedule:
    # 11:07-23:07 MSK, every 2 hours (UTC schedule).
    # Avoid the top of the hour because GitHub scheduled workflows can be delayed or dropped under high load.
    - cron: "7 8-20/2 * * *"

permissions:
  contents: write

concurrency:
  group: agentic-digest-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python publisher.py

      - name: Commit publication state
        run: |
          git config user.name "agentic-digest-bot"
          git config user.email "agentic-digest-bot@users.noreply.github.com"

          git add state/published.jsonl
          git commit -m "Update publication state" || exit 0
          git push
